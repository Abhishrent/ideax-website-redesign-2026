          <section id="about">
            <h2>About MBMC IdeaX 2026</h2>
            <p>MBMC IdeaX 2026 is a 48-hour national technology hackathon uniting 500+ student developers, innovators, and designers across Nepal to solve pressing real-world challenges through software and hardware innovation.</p>
          </section>

          <section id="tracks">
            <h2>5 Problem Tracks</h2>
            <ul>
              <li><strong>01. Climate Change, Resilience &amp; Sustainability:</strong> Strengthen disaster preparedness, early warning systems, and tools for sustainable resource management.</li>
              <li><strong>02. Cyber Security &amp; Digital Trust:</strong> Build solutions that harden digital infrastructure and strengthen trust across public and private systems.</li>
              <li><strong>03. E-Governance &amp; Smart Public Services:</strong> Make public services faster, accessible, and transparent through technology.</li>
              <li><strong>04. Smart Urban Transport &amp; Road Safety:</strong> Design systems that make urban mobility safer, smarter, and easier to navigate.</li>
              <li><strong>05. FinTech &amp; Digital Financial Innovation:</strong> Build the next generation of inclusive digital financial tools.</li>
            </ul>
          </section>

          <section id="prizes">
            <h2>Prizes Pool: Rs. 111,111</h2>
            <ul>
              <li><strong>Grand Winner:</strong> Rs. 50,000 cash prize + Incubation &amp; Mentorship</li>
              <li><strong>Track Winners (5 Tracks):</strong> Rs. 10,000 per track winner</li>
              <li><strong>Entry Fee:</strong> Rs. 0 (100% Free Entry)</li>
            </ul>
          </section>

              <li>Final On-Site Hackathon: October 2–4, 2026 (16th–18th Ashoj 2083)</li>
              <li>Venue: Madan Bhandari Memorial College, New Baneshwor, Kathmandu, Nepal</li>
            </ul>
          </section>
